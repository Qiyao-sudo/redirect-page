<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=http://qixiu1.top:2019/">
  <title>正在跳转…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      max-width: 90vw;
    }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 24px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 14px; opacity: 0.85; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 28px;
      background: #fff;
      color: #764ba2;
      border-radius: 999px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.15s ease;
    }
    a:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>正在跳转</h1>
    <p>即将前往 <strong>qixiu1.top:2019</strong><br>如果没有自动跳转，请点击下方按钮</p>
    <a href="http://qixiu1.top:2019/">手动跳转</a>
  </div>
  <script>
    window.location.replace("http://qixiu1.top:2019/");
  </script>
</body>
</html>
